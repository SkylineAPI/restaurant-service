apiVersion: v1
kind: ConfigMap
metadata:
  name: restaurant-service-config
  namespace: foodexpress
data:
  PORT: "3000"
  MONGO_URI: "mongodb://restaurant-mongo:27017/restaurantdb"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: restaurant-service
  namespace: foodexpress
  labels:
    app: restaurant-service
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: restaurant-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: restaurant-service
        tier: backend
    spec:
      containers:
        - name: restaurant-service
          image: restaurant-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: restaurant-service-config
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          readinessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: restaurant-service
  namespace: foodexpress
spec:
  type: NodePort
  selector:
    app: restaurant-service
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30001
---
# Scale between 2 and 5 pods based on CPU (requires: minikube addons enable metrics-server)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: restaurant-service-hpa
  namespace: foodexpress
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: restaurant-service
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
